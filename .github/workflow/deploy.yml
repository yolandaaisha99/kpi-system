name: Deploy KPI System to Cloud Run

on:
  push:
    branches:
      - main        # Deploy otomatis setiap push ke main
  pull_request:
    branches:
      - main        # Test (build only) setiap PR

env:
  GCP_REGION: asia-southeast2
  GCR_HOSTNAME: gcr.io

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Deploy Backend Laravel
  # ──────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & Push Docker image Backend
        run: |
          gcloud auth configure-docker
          docker build -t $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:$GITHUB_SHA \
            ./backend
          docker push $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:$GITHUB_SHA

      - name: Deploy Backend ke Cloud Run
        run: |
          gcloud run deploy kpi-backend \
            --image $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_ENV=production \
            --set-env-vars APP_KEY=${{ secrets.APP_KEY }} \
            --set-env-vars DB_HOST=${{ secrets.CLOUD_SQL_HOST }} \
            --set-env-vars DB_DATABASE=kpi_system \
            --set-env-vars DB_USERNAME=root \
            --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5

  # ──────────────────────────────────────────
  # JOB 2: Deploy Frontend React (Web Manajer)
  # ──────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Web Manajer (React)
    runs-on: ubuntu-latest
    needs: deploy-backend   # Tunggu backend selesai dulu

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies Frontend
        run: |
          cd frontend
          npm ci

      - name: Build React App
        run: |
          cd frontend
          VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Build & Push Docker image Frontend
        run: |
          gcloud auth configure-docker
          docker build -t $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:$GITHUB_SHA \
            ./frontend
          docker push $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:$GITHUB_SHA

      - name: Deploy Frontend ke Cloud Run
        run: |
          gcloud run deploy kpi-frontend \
            --image $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3

  # ──────────────────────────────────────────
  # JOB 3: Deploy Mobile PWA (Karyawan)
  # ──────────────────────────────────────────
  deploy-mobile:
    name: 📱 Deploy Mobile Karyawan (React PWA)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies Mobile
        run: |
          cd mobile
          npm ci

      - name: Build React PWA
        run: |
          cd mobile
          VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Build & Push Docker image Mobile
        run: |
          gcloud auth configure-docker
          docker build -t $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:$GITHUB_SHA \
            ./mobile
          docker push $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:$GITHUB_SHA

      - name: Deploy Mobile ke Cloud Run
        run: |
          gcloud run deploy kpi-mobile \
            --image $GCR_HOSTNAME/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3

  # ──────────────────────────────────────────
  # JOB 4: Notifikasi hasil deploy
  # ──────────────────────────────────────────
  notify:
    name: ✅ Selesai
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-mobile]
    if: always()

    steps:
      - name: Rangkuman Deploy
        run: |
          echo "======================================"
          echo "  KPI System Deploy Summary"
          echo "======================================"
          echo "Backend  : ${{ needs.deploy-backend.result }}"
          echo "Frontend : ${{ needs.deploy-frontend.result }}"
          echo "Mobile   : ${{ needs.deploy-mobile.result }}"
          echo "Commit   : $GITHUB_SHA"
          echo "======================================"
