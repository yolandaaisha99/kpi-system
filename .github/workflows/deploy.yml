name: Deploy KPI System to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GCP_REGION: asia-southeast2
  GCR_HOSTNAME: gcr.io

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image Backend
        run: docker build -t ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:${{ github.sha }} ./backend

      - name: Push Docker image Backend
        run: docker push ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:${{ github.sha }}

      - name: Deploy Backend ke Cloud Run
        run: |
          gcloud run deploy kpi-backend \
            --image ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-backend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_ENV=production \
            --set-env-vars APP_KEY=${{ secrets.APP_KEY }} \
            --set-env-vars DB_HOST=${{ secrets.CLOUD_SQL_HOST }} \
            --set-env-vars DB_DATABASE=kpi_system \
            --set-env-vars DB_USERNAME=root \
            --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5

  deploy-frontend:
    name: 🌐 Deploy Web Manajer (React)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies Frontend
        run: cd frontend && npm install

      - name: Build React App
        run: cd frontend && VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image Frontend
        run: docker build -t ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:${{ github.sha }} ./frontend

      - name: Push Docker image Frontend
        run: docker push ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:${{ github.sha }}

      - name: Deploy Frontend ke Cloud Run
        run: |
          gcloud run deploy kpi-frontend \
            --image ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-frontend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3

  deploy-mobile:
    name: 📱 Deploy Mobile Karyawan (React PWA)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout kode dari GitHub
        uses: actions/checkout@v4

      - name: Autentikasi ke Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies Mobile
        run: cd mobile && npm install

      - name: Build React PWA
        run: cd mobile && VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image Mobile
        run: docker build -t ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:${{ github.sha }} ./mobile

      - name: Push Docker image Mobile
        run: docker push ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:${{ github.sha }}

      - name: Deploy Mobile ke Cloud Run
        run: |
          gcloud run deploy kpi-mobile \
            --image ${{ env.GCR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/kpi-mobile:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3

  notify:
    name: ✅ Selesai
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-mobile]
    if: always()

    steps:
      - name: Rangkuman Deploy
        run: |
          echo "Backend  : ${{ needs.deploy-backend.result }}"
          echo "Frontend : ${{ needs.deploy-frontend.result }}"
          echo "Mobile   : ${{ needs.deploy-mobile.result }}"