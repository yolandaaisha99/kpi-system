name: Deploy KPI System to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_REGION: asia-southeast2

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Backend ke Cloud Run
        run: |
          gcloud run deploy kpi-backend \
            --source ./backend \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="APP_ENV=production,APP_KEY=${{ secrets.APP_KEY }},DB_HOST=${{ secrets.CLOUD_SQL_HOST }},DB_DATABASE=kpi_system,DB_USERNAME=root,DB_PASSWORD=${{ secrets.DB_PASSWORD }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5

  deploy-frontend:
    name: Deploy Web Manager React
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dan Build Frontend
        run: |
          cd frontend/web_manager
          npm install
          VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Deploy Frontend ke Cloud Run
        run: |
          gcloud run deploy kpi-frontend \
            --source ./frontend/web_manager \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3 \
            --clear-base-image

  deploy-mobile:
    name: Deploy Mobile Karyawan PWA
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dan Build Mobile
        run: |
          cd frontend/mobile
          npm install
          VITE_API_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Deploy Mobile ke Cloud Run
        run: |
          gcloud run deploy kpi-mobile \
            --source ./frontend/mobile \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3 \
            --clear-base-image

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-mobile]
    if: always()

    steps:
      - name: Print Result
        run: |
          echo "Backend  : ${{ needs.deploy-backend.result }}"
          echo "Frontend : ${{ needs.deploy-frontend.result }}"
          echo "Mobile   : ${{ needs.deploy-mobile.result }}"